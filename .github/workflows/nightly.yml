name: Nightly release

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC every day
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modularjobs
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODULARJOBS_TEST_MYSQL_URL: jdbc:mysql://localhost:13306/modularjobs
      MODULARJOBS_TEST_MYSQL_USER: test
      MODULARJOBS_TEST_MYSQL_PASSWORD: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply MySQL schema (for MySQL-backed unit tests)
        run: |
          ./scripts/apply-mysql-schema.sh \
            "mysql://test:test@127.0.0.1:13306/modularjobs"

      - name: Check
        run: ./gradlew clean check -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon

      - name: Shadow jar
        run: ./gradlew :modularjobs-paper:shadowJar -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon

      - name: Replace rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly modularjobs-paper/build/libs/*-all.jar \
            --prerelease \
            --title "Nightly $(date -u +%F)" \
            --notes "Automated nightly build from ${GITHUB_SHA}."
